# .github/workflows/deploy-frontends.yml

name: Deploy via Commit Message

on:
  push:
    branches:
      - main # Or your default branch

jobs:
  # This job builds and deploys BOTH applications if the commit message is correct
  build-and-deploy:
    # IMPORTANT: This line makes the job run ONLY if the commit message contains "deploy:"
    if: contains(github.event.head_commit.message, 'deploy:')
    name: Build and Deploy Frontends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Extract Ngrok URL from commit message
        id: extract_url
        # This command finds the URL in the commit message and saves it to a variable
        run: |
          URL=$(echo "${{ github.event.head_commit.message }}" | grep -o 'https://[a-zA-Z0-9.-]*\.ngrok-free\.dev')
          echo "NGROK_URL=$URL" >> $GITHUB_ENV
          echo "Extracted URL: $URL"

      # --- Build Web Plugin ---
      - name: Replace API URL for Web Plugin
        # Use the URL extracted in the previous step
        run: |
          sed -i "s|http://localhost:8000|${{ env.NGROK_URL }}|g" apps/web-plugin/src/config.ts
          echo "API URL in web-plugin replaced."

      - name: Build web-plugin application
        run: yarn workspace @tax-demo-apps/web-plugin build

      - name: Deploy Web Plugin to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web-plugin/dist
          destination_dir: ./zoho_accounting
          keep_files: true

      # --- Build Client Mobile ---
      - name: Replace API URL for Client Mobile
        # Use the same extracted URL
        run: |
          sed -i "s|http://localhost:8000|${{ env.NGROK_URL }}|g" apps/client-mobile/src/services/api.ts
          echo "API URL in client-mobile replaced."

      - name: Build client-mobile application
        run: yarn workspace @tax-demo-apps/client-mobile build

      - name: Deploy Client Mobile to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/client-mobile/dist
          destination_dir: ./zoho_accounting/mobile
          keep_files: true
