# .github/workflows/deploy-frontends.yml

name: Deploy via Commit Message

on:
  push:
    branches:
      - main # This should be your main development branch

jobs:
  build-and-deploy:
    # This job will only run if the commit message contains the keyword "deploy:"
    if: contains(github.event.head_commit.message, 'deploy:')
    name: Build and Deploy Frontends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Extract Ngrok URL from commit message
        id: extract_url
        run: |
          # This robustly extracts the ngrok URL from the commit message.
          # It specifically looks for the line starting with "deploy:"
          URL=$(echo "${{ github.event.head_commit.message }}" | grep -i '^deploy:' | grep -o 'https://[a-zA-Z0-9.-]*\.ngrok-free\.app' | head -n 1)

          if [[ -z "$URL" ]]; then
            echo "::error::Could not find a valid ngrok URL in the commit message."
            echo "::error::Please ensure your commit includes a line formatted exactly like: 'deploy: https://your-id.ngrok-free.app'"
            exit 1
          fi
          
          echo "NGROK_URL=$URL" >> $GITHUB_ENV
          echo "✅ Successfully extracted URL: $URL"

      # --- Build and Deploy Web Plugin ---
      - name: Replace API URL for Web Plugin
        run: |
          sed -i "s|http://localhost:8000|${{ env.NGROK_URL }}|g" apps/web-plugin/src/config.ts
          sed -i "s|http://localhost:8000|${{ env.NGROK_URL }}|g" apps/web-plugin/src/services/api.ts
      - name: Build web-plugin application
        # ✅ CORRECTED: Uses the actual package name "web-plugin"
        run: yarn workspace web-plugin build

      - name: Deploy Web Plugin to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web-plugin/dist
          destination_dir: ./ # Matches the 'base' in its vite.config.ts
          keep_files: true # This is critical for monorepos

      # --- Build and Deploy Client Mobile ---
      - name: Replace API URL for Client Mobile
        run: sed -i "s|http://localhost:8000|${{ env.NGROK_URL }}|g" apps/client-mobile/src/services/api.ts

      - name: Build client-mobile application
        # ✅ CORRECTED: Uses the actual package name "client-mobile"
        run: yarn workspace client-mobile build

      - name: Deploy Client Mobile to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/client-mobile/dist
          destination_dir: ./mobile # Matches the 'base' in its vite.config.ts
          keep_files: true
